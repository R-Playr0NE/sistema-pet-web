<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Produtos</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container py-5">

        <div class="produto-card">

            <!-- Cabeçalho -->
            <div class="produto-header">

                <div>
                    <h1 class="mb-1">Listagem de Produtos</h1>
                    <p class="mb-0">
                        Confira os produtos cadastrados no sistema
                    </p>
                </div>

                <a th:href="@{/home}" class="btn btn-light btn-voltar">
                    ← Voltar
                </a>

            </div>


            <!-- Conteúdo -->
            <div class="produto-body">

                <!-- Botão Novo Produto -->
                <div class="d-flex justify-content-end mb-4">

                    <a th:href="@{/produtos/criar}" class="btn btn-green btn-novo">

                        + Novo Produto

                    </a>

                </div>


                <!-- Tabela responsiva -->
                <div class="table-responsive">

                    <table class="table table-hover produto-table align-middle">

                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Marca</th>
                                <th>Unidade</th>
                                <th>Valor</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="produto : ${produtos}">

                                <td>
                                    <span class="produto-descricao" th:text="${produto.descricaoProduto}">
                                    </span>
                                </td>

                                <td>
                                    <span class="produto-marca" th:text="${produto.marcaProduto}">
                                    </span>
                                </td>

                                <td>
                                    <span class="badge unidade-badge" th:text="${produto.unidadeProduto}">
                                    </span>
                                </td>

                                <td>
                                    <strong class="produto-valor">
                                        R$
                                        <span th:text="${produto.valorProduto}">
                                        </span>
                                    </strong>
                                </td>

                                <td>

                                    <div class="d-flex justify-content-center gap-2">

                                        <a th:href="@{/produtos/editar/{id}(id=${produto.idProduto})}"
                                            class="btn btn-sm btn-editar">

                                            Editar

                                        </a>

                                        <a th:href="@{/produtos/excluir/{id}(id=${produto.idProduto})}"
                                            class="btn btn-sm btn-excluir"
                                            onclick="return confirm('Deseja realmente excluir este produto?');">

                                            Excluir

                                        </a>

                                    </div>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
