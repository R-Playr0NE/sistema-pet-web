<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container py-5">

        <div class="produto-form-card">

            <!-- Cabeçalho -->
            <div class="produto-form-header">

                <div>
                    <h1>
                        <i class="bi bi-box-seam"></i>
                        Cadastro de Produtos
                    </h1>

                    <p class="mb-0">
                        Preencha os dados do produto
                    </p>
                </div>

                <a th:href="@{/produtos/listar}" class="btn btn-light btn-voltar">

                    <i class="bi bi-arrow-left"></i>
                    Voltar

                </a>

            </div>


            <!-- Formulário -->
            <div class="produto-form-body">

                <form th:action="@{/produtos/salvar}" method="post" th:object="${produto}">

                    <!-- ID oculto -->
                    <input type="hidden" name="idProduto" th:field="*{idProduto}">


                    <div class="row g-4">

                        <!-- Descrição -->
                        <div class="col-12">

                            <label for="descricaoProduto">
                                <i class="bi bi-card-text"></i>
                                Descrição
                            </label>

                            <input type="text" id="descricaoProduto" name="descricaoProduto"
                                th:field="*{descricaoProduto}" class="form-control"
                                placeholder="Digite a descrição do produto">

                        </div>


                        <!-- Marca -->
                        <div class="col-md-6">

                            <label for="marcaProduto">
                                <i class="bi bi-tag"></i>
                                Marca
                            </label>

                            <input type="text" id="marcaProduto" name="marcaProduto" th:field="*{marcaProduto}"
                                class="form-control" placeholder="Digite a marca">

                        </div>


                        <!-- Unidade -->
                        <div class="col-md-6">

                            <label for="unidadeProduto">
                                <i class="bi bi-box"></i>
                                Unidade
                            </label>

                            <input type="text" id="unidadeProduto" name="unidadeProduto" th:field="*{unidadeProduto}"
                                class="form-control" placeholder="Ex.: UN, KG, CX">

                        </div>


                        <!-- Valor -->
                        <div class="col-md-6">

                            <label for="valorProduto">
                                <i class="bi bi-currency-dollar"></i>
                                Valor
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    R$
                                </span>

                                <input type="text" id="valorProduto" name="valorProduto" th:field="*{valorProduto}"
                                    class="form-control" placeholder="0,00">

                            </div>

                        </div>

                    </div>


                    <!-- Botões -->
                    <div class="produto-form-actions">

                        <a th:href="@{/produtos/listar}" class="btn btn-secondary btn-form">

                            <i class="bi bi-x-circle"></i>
                            Cancelar

                        </a>

                        <button type="submit" class="btn btn-green btn-form">

                            <i class="bi bi-check-circle"></i>
                            Salvar Produto

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
