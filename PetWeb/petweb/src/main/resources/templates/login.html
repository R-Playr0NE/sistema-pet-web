<!-- login.html -->
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg border-0 rounded-4 pet-card">

            <!-- Header -->
            <div class="card-header text-center text-white border-0 rounded-top-4 pet-header">
                <div class="fs-1">🔐</div>
                <h1 class="fw-bold">Login</h1>
                <p class="mb-0">Acesse sua conta no sistema</p>
            </div>

            <!-- Body -->
            <div class="card-body p-5">

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-lg btn-pink w-100">
                        Entrar
                    </button>

                </form>

                <p class="text-danger text-center mt-3" th:if="${param.error}">
                    Login inválido
                </p>

                <p class="text-success text-center mt-3" th:if="${param.logout}">
                    Logout efetuado
                </p>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center bg-white border-0 text-muted small pb-4">
                © 2026 PetWeb
            </div>

        </div>
    </div>

</body>

</html>
