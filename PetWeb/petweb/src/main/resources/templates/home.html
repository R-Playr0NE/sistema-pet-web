<!DOCTYPE html>
<!-- <html lang="pt-br" xmlns:th="http://www.thymeleaf.org"> -->
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PetWeb</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg border-0 rounded-4 pet-card">

            <!-- Header -->
            <div class="card-header text-center text-white border-0 rounded-top-4 pet-header">
                <div class="fs-1">🐾</div>
                <h1 class="fw-bold">PetWeb</h1>
                <p class="mb-0">Painel Principal do Sistema</p>
            </div>

            <!-- Body -->
            <div class="card-body p-5 text-center">

                <h2 class="fw-bold mb-3">Bem-vindo!</h2>

                <p class="text-muted mb-4">
                    Escolha uma das opções abaixo para gerenciar o sistema.
                </p>

                <div class="d-grid gap-3">

                    <a href="/clientes/listar" class="btn btn-lg btn-pink w-100">
                        👤 Clientes
                    </a>

                    <a href="/animais/listar" class="btn btn-lg btn-green w-100">
                        🐶 Animais
                    </a>

                    <a href="/veterinarios/listar" class="btn btn-lg btn-pink w-100">
                        Veterinarios
                    </a>

                    <a href="/consultas/listar" class="btn btn-lg btn-green w-100">
                        Consultas
                    </a>

                </div>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center bg-white border-0 text-muted small pb-4">
                © 2026 PetWeb
            </div>

        </div>
    </div>

</body>
</html>
