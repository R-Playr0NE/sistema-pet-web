<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetWeb - Sistema de Gerenciamento de Pets</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Meu css -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg border-0 rounded-4 pet-card">

            <!-- Header -->
            <div class="card-header text-center text-white border-0 rounded-top-4 pet-header">
                <div class="fs-1"><i class="bi bi-house-heart-fill"></i></div>
                <h1 class="fw-bold">PetWeb</h1>
                <p class="mb-0">Gerenciamento Completo para Seus Pets</p>
            </div>

            <!-- Body -->
            <div class="card-body p-5 text-center">
                <h2 class="fw-bold mb-3">Bem-vindo!</h2>

                <p class="text-muted mb-4">
                    Gerencie todas as informações dos seus pets em um só lugar.
                    Organize registros de saúde, vacinações e muito mais.
                </p>

                <div class="d-grid gap-3">

                    <form action="/login" method="get">
                        <button type="submit" class="btn btn-lg btn-pink w-100"><i class="bi bi-unlock-fill"></i> Acesso ao Sistema</button>
                    </form>

                    <form action="/usuarios/criar" method="get">
                        <button type="submit" class="btn btn-lg btn-green w-100"><i class="bi bi-person-plus-fill"></i> Cadastre-se</button>
                    </form>

                </div>
            </div>

            <!-- Footer -->
            <div class="card-footer text-center bg-white border-0 text-muted small pb-4">
                © 2026 PetWeb. Todos os direitos reservados |
                <a href="#" class="text-decoration-none fw-bold">Política de Privacidade</a>
            </div>

        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
