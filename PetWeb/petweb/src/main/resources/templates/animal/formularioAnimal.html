<!-- formularioAnimal.html -->
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Animais</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow-lg border-0 rounded-4 pet-card">

            <div class="card-header text-center text-white pet-header">
                <h1 class="fw-bold"><i class="bi bi-bookmark-heart-fill"></i> Animal</h1>
            </div>

            <div class="card-body p-5">

                <form th:action="@{/animais/salvar}" method="post" th:object="${animal}">

                    <input type="hidden" th:field="*{idAnimal}">

                    <div class="mb-3">
                        <label>Nome</label>
                        <input type="text" th:field="*{nomeAnimal}" class="form-control"
                        placeholder="Informe o nome do animal">
                    </div>

                    <div class="mb-3">
                        <label>Raça</label>
                        <input type="text" th:field="*{raca}" class="form-control"
                        placeholder="Informe a raça do animal">
                    </div>

                    <div class="mb-3">
                        <label for="idCliente">Tutor/Dono</label>
                        <select th:field="*{cliente}" class="form-select">
                            <option value="" disabled selected>Selecione o tutor/dono</option>
                            <option th:each="cliente : ${clientes}"
                            th:text="${cliente.nomeCliente}"
                            th:value="${cliente.idCliente}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Porte</label>
                        <select th:field="*{porte}" class="form-select">
                            <option value="">Selecione</option>
                            <option value="Pequeno">Pequeno</option>
                            <option value="Médio">Médio</option>
                            <option value="Grande">Grande</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label>Peso</label>
                        <input type="text" th:field="*{peso}" class="form-control"
                        placeholder="Ex.: 12.50 kg">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-green">Salvar</button>
                        <a th:href="@{/animais/listar}" class="btn btn-secondary">Voltar</a>
                    </div>

                </form>

            </div>
        </div>
    </div>

</body>

</html>
