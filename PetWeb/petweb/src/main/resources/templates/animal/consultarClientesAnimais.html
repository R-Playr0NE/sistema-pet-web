<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lista de Tutores e Animais</title>

    <!-- Ícone da página -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- CSS do projeto -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div class="container py-5">
      <div class="produto-card">
        <!-- Cabeçalho -->
        <div class="produto-header">
          <div>
            <h1 class="mb-1">
              <i class="bi bi-heart-pulse-fill"></i>
              Lista de Tutores e Animais
            </h1>

            <p class="mb-0">
              Consulte os tutores e seus respectivos animais cadastrados.
            </p>
          </div>

          <a th:href="@{/home}" class="btn btn-light btn-voltar">
            <i class="bi bi-house-fill"></i>
            Voltar
          </a>
        </div>

        <!-- Corpo -->
        <div class="produto-body">
          <div class="table-responsive">
            <table class="table align-middle produto-table">
              <thead>
                <tr>
                  <th>
                    <i class="bi bi-person-fill"></i>
                    Tutor
                  </th>

                  <th>
                    <i class="bi bi-telephone-fill"></i>
                    Telefone
                  </th>

                  <th>
                    <i class="bi bi-heart-fill"></i>
                    Animal
                  </th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="resultado : ${resultados}">
                  <td
                    class="produto-descricao"
                    th:text="${resultado.nomeCliente}"
                  ></td>

                  <td
                    class="produto-marca"
                    th:text="${resultado.telefoneCliente}"
                  ></td>

                  <td>
                    <span
                      class="unidade-badge"
                      th:text="${resultado.nomeAnimal}"
                    >
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
