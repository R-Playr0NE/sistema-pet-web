<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário de Pedidos</h1>
    <a th:href="@{/home}" class="btn btn-secondary">
        Voltar
    </a>

    <datalist id="listaClientes">
        <option th:each="cliente : ${clientes} " th:value="${cliente.idCliente + ' - ' + cliente.nomeCliente}">
        </option>
    </datalist>

    <datalist id="listaProdutos">
        <option th:each="produto : ${produtos}" th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
            th:attr="data-preco=${produto.valorProduto}">
        </option>
    </datalist>
    <p>I. Identificação do Cliente</p>
    <label for="cliente">Cliente</label>
    <br />
    <input list="listaClientes" id="cliente" type="text" placeholder="Digite o nome ou código do Cliente">

    <p>II. Adcionar produto ao Pedido</p>
    <label for="produto">Produto</label>
    <br />
    <input list="listaProdutos" id="produto" type="text" placeholder="Digite o produto">

    <label for="quantidade">Quantidade</label>
    <input type="number" id="quantidade" placeholder="0" min="1">
    <button type="button" onclick="adicionarItem()">
        <span>+</span>Adicionar
    </button>
    <!-- Tabela dos itens -->
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço Unitário</th>
                <th>Subtotal</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabela-itens">
            <tr id="empty-row">
                <td colspan="5">Nenhum produto adicionado ao pedido</td>
            </tr>
        </tbody>
    </table>
    <span>Total do Pedido</span>
    <span>R$ <span id="totalPedido">0,00</span></span>
    <br />
    <button onclick="salvarPedido()">Confirmar e Salver Pedido</button>

    <script>
        let itens = [];



        function adicionarItem() {
            let produtoInput = document.getElementById("produto").value;
            let quantidade = document.getElementById("quantidade").value;



            if (!produtoInput || quantidade <= 0) {
                alert("Preencha corretamente o produto e a quantidade!");
                return;
            }



            let partes = produtoInput.split(" - ");
            let produtoId = partes[0];
            let produtoNome = partes[1];



            let options = document.querySelectorAll("#listaProdutos option");
            let preco = null;



            options.forEach(opt => {
                if (opt.value === produtoInput) {
                    preco = opt.getAttribute("data-preco");
                }
            });



            if (!preco) {
                alert("Produto inválido! Selecione um produto da lista.");
                return;
            }



            let subtotal = quantidade * preco;



            itens.push({
                produto: { idProduto: produtoId },
                nomeProduto: produtoNome,
                quantidade: parseInt(quantidade),
                preco: parseFloat(preco),
                subtotal: subtotal
            });



            document.getElementById("produto").value = "";
            document.getElementById("quantidade").value = "";



            renderTabela();
        }



        function removerItem(index) {
            itens.splice(index, 1);
            renderTabela();
        }



        function renderTabela() {
            let tabela = document.getElementById("tabela-itens");
            let emptyRow = document.getElementById("empty-row");



            tabela.innerHTML = "";



            if (itens.length === 0) {
                tabela.innerHTML = `<tr class="empty-row" id="empty-row"><td colspan="5">Nenhum produto adicionado ao pedido.</td></tr>`;
                document.getElementById("totalPedido").innerText = "0,00";
                return;
            }



            let total = 0;



            itens.forEach((item, index) => {
                total += item.subtotal;
                tabela.innerHTML += `
<tr>
<td>${item.nomeProduto}</td>
<td>${item.quantidade}</td>
<td>R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
<td>R$ ${item.subtotal.toFixed(2).replace('.', ',')}</td>
<td><button class="btn-remove" onclick="removerItem(${index})">Remover</button></td>
</tr>
                `;
            });



            document.getElementById("totalPedido").innerText = total.toFixed(2).replace('.', ',');
        }



        function salvarPedido() {
            let clienteInput = document.getElementById("cliente").value;



            if (!clienteInput) {
                alert("Selecione um cliente antes de salvar!");
                return;
            }



            if (itens.length === 0) {
                alert("Adicione ao menos um produto ao pedido!");
                return;
            }



            let clienteId = clienteInput.split(" - ")[0];



            let pedido = {
                cliente: { idCliente: clienteId },
                itens: itens
            };



            fetch("/pedidos", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(pedido)
            })
                .then(res => res.json())
                .then(data => {
                    alert("Pedido salvo com sucesso!");
                    location.reload();
                })
                .catch(err => {
                    alert("Erro ao salvar o pedido. Tente novamente.");
                    console.error(err);
                });
        }
    </script>

</body>
</html>
