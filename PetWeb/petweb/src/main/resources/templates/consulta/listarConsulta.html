<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Consultas</title>

    <!-- Ícone -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container py-5">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header text-center text-white pet-header">
                <h1 class="fw-bold mb-0"><i class="bi bi-clipboard-pulse"></i> Consultas</h1>
            </div>

            <div class="card-body">

                <div class="d-flex justify-content-between mb-4">

                    <a th:href="@{/consultas/criar}" class="btn btn-green">
                        + Cadastrar Consulta
                    </a>

                    <a th:href="@{/home}" class="btn btn-secondary">
                        Voltar
                    </a>

                </div>

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>Data</th>
                                <th>Hora</th>
                                <th>Veterinário</th>
                                <th>Animal</th>
                                <th>Valor</th>
                                <th>Diagnóstico</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="consulta : ${consultas}">

                                <td th:text="${consulta.dataConsulta}"></td>

                                <td th:text="${consulta.horaConsulta}"></td>

                                <td th:text="${consulta.veterinario.nomeVeterinario}"></td>

                                <td th:text="${consulta.animal.nomeAnimal}"></td>

                                <td th:text="${consulta.valorConsulta}"></td>

                                <td th:text="${consulta.diagnosticoConsulta}"></td>

                                <td>

                                    <a th:href="@{/consultas/editar/{id}(id=${consulta.idConsulta})}"
                                        class="btn btn-sm btn-warning">
                                        Editar
                                    </a>

                                    <a th:href="@{/consultas/excluir/{id}(id=${consulta.idConsulta})}"
                                        class="btn btn-sm btn-danger">
                                        Excluir
                                    </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </div>

</body>

</html>
