<!-- formularioCliente.html -->
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow-lg border-0 rounded-4 pet-card">

            <div class="card-header text-center text-white pet-header">
                <h1 class="fw-bold"><i class="bi bi-file-person-fill"></i> Cliente</h1>
            </div>

            <div class="card-body p-5">

                <form th:action="@{/clientes/salvar}" method="post" th:object="${cliente}">

                    <input type="hidden" th:field="*{idCliente}">

                    <div class="mb-3">
                        <label>Nome</label>
                        <input type="text" th:field="*{nomeCliente}" class="form-control"
                        placeholder="Digite o nome">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" th:field="*{emailCliente}" class="form-control"
                        placeholder="exemplo@email.com">
                    </div>

                    <div class="mb-3">
                        <label>Telefone</label>
                        <input type="text" th:field="*{telefoneCliente}" class="form-control mascara-telefone"
                        placeholder="(11) 99999-9999">
                    </div>

                    <div class="mb-3">
                        <label>Endereço</label>
                        <input type="text" th:field="*{enderecoCliente}" class="form-control"
                        placeholder="Informe o endereço completo">
                    </div>

                    <div class="mb-4">
                        <label>CPF</label>
                        <input type="text" th:field="*{cpfCliente}" class="form-control mascara-cpf"
                        placeholder="000.000.000-00">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-green">Salvar</button>
                        <a th:href="@{/clientes/listar}" class="btn btn-secondary">Voltar</a>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script th:src="@{/js/mascaras.js}"></script>
</body>

</html>
