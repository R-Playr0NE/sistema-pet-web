<!-- formularioUsuario.html -->
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <!-- Icone da pagina -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg border-0 rounded-4 pet-card">

            <!-- Header -->
            <div class="card-header text-center text-white border-0 rounded-top-4 pet-header">
                <div class="fs-1">✨</div>
                <h1 class="fw-bold">Cadastro</h1>
                <p class="mb-0">Crie sua conta no sistema</p>
            </div>

            <!-- Body -->
            <div class="card-body p-5">

                <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuario}">

                    <input type="hidden" th:field="*{idUsuario}">

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" th:field="*{nomeUsuario}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" th:field="*{emailUsuario}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CPF</label>
                        <input type="text" th:field="*{cpfUsuario}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Telefone</label>
                        <input type="text" th:field="*{telefoneUsuario}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Login</label>
                        <input type="text" th:field="*{loginUsuario}" class="form-control">
                    </div>

                    <!-- Campo da senha -->
                    <div class="mb-4">

                        <label class="form-label">Senha</label>

                        <!-- Input + botão visualizar -->
                        <div class="input-group">

                            <input type="password" th:field="*{senhaUsuario}" class="form-control" id="senhaUsuario"
                                placeholder="Digite sua senha">

                            <button class="btn btn-outline-secondary" type="button" id="toggleSenha">
                                👁
                            </button>

                        </div>

                        <!-- Barra de força -->
                        <div class="progress mt-3" style="height: 8px;">
                            <div id="barraForca" class="progress-bar" role="progressbar" style="width: 0%;">
                            </div>
                        </div>

                        <!-- Texto da força -->
                        <small id="textoForca" class="text-muted">
                            Digite uma senha
                        </small>

                        <!-- Requisitos -->
                        <div class="password-rules mt-3">

                            <p class="mb-2 fw-semibold">
                                Sua senha deve conter:
                            </p>

                            <ul class="list-unstyled small">

                                <li id="regraTamanho">
                                    ❌ Mínimo 8 caracteres
                                </li>

                                <li id="regraMaiuscula">
                                    ❌ Letra maiúscula
                                </li>

                                <li id="regraMinuscula">
                                    ❌ Letra minúscula
                                </li>

                                <li id="regraNumero">
                                    ❌ Número
                                </li>

                                <li id="regraEspecial">
                                    ❌ Caractere especial
                                </li>

                            </ul>

                        </div>

                    </div>

                    <!-- Confirmar senha -->
                    <div class="mb-4">

                        <label class="form-label">Confirmar senha</label>

                        <div class="input-group">

                            <input type="password" th:field="*{confirmarSenha}" class="form-control" id="confirmarSenha"
                                placeholder="Confirme sua senha">

                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmarSenha">
                                👁
                            </button>

                        </div>

                        <small id="textoConfirmacao" class="text-muted">
                        </small>

                    </div>

                    <button type="submit" class="btn btn-lg btn-green w-100">
                        Salvar Cadastro
                    </button>

                </form>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center bg-white border-0 text-muted small pb-4">
                © 2026 PetWeb
            </div>

        </div>
    </div>

    <script th:src="@{/js/senha-validator.js}"></script>

</body>

</html>
