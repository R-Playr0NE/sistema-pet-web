<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Veterinários</title>

    <!-- Ícone da página -->
    <link rel="icon" type="image/png" th:href="@{/img/paginaicon.png}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container py-5">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header text-center text-white pet-header">
                <h1 class="fw-bold mb-0">🩺 Veterinários</h1>
            </div>

            <div class="card-body">

                <div class="d-flex justify-content-between mb-4">

                    <a th:href="@{/veterinarios/criar}" class="btn btn-green">
                        + Cadastrar Veterinário
                    </a>

                    <a th:href="@{/home}" class="btn btn-secondary">
                        Voltar
                    </a>

                </div>

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>CRMV</th>
                                <th>Especialidade</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="veterinario : ${veterinarios}">

                                <td th:text="${veterinario.nomeVeterinario}"></td>

                                <td th:text="${veterinario.cpfVeterinario}"></td>

                                <td th:text="${veterinario.telefoneVeterinario}"></td>

                                <td th:text="${veterinario.crmvVeterinario}"></td>

                                <td th:text="${veterinario.especialidadeVeterinario}"></td>

                                <td>

                                    <a th:href="@{/veterinarios/editar/{id}(id=${veterinario.idVeterinario})}"
                                        class="btn btn-sm btn-warning">
                                        Editar
                                    </a>

                                    <a th:href="@{/veterinarios/excluir/{id}(id=${veterinario.idVeterinario})}"
                                        class="btn btn-sm btn-danger">
                                        Excluir
                                    </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </div>

</body>

</html>
